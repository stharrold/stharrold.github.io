# Published notebooks (content/), generated output/, and vendored themes/ are not linted. The MSSP study's
# notebook exports are kept byte-for-byte as uploaded to OSF (their sha256 is in the post).
exclude: ^(content|output|themes|analysis/mssp-benchmark-ratchet/report/exports)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
