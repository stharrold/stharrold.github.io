# Weekly version updates as one grouped PR per ecosystem, targeting src_develop (git-flow):
# merging into src_master deploys, so updates go through src_develop first.
# Security updates (enabled in repo settings) always target the default branch, src_master.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "src_develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "src_develop"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
