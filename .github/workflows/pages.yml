# Lint, test, and build the site on every push and pull request.
# Deploy to GitHub Pages only from src_master (Settings > Pages > Source: GitHub Actions).
# Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
name: Build and deploy site

on:
  push:
    branches: [src_master, src_develop, "src_feature_**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -v
      - name: Build site
        run: uv run pelican --settings publishconf.py --fatal warnings
      - name: Build search index
        run: uv run python -m pagefind --site output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/src_master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
