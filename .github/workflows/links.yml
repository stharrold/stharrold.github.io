# Weekly log of internal and external link status for all posts and pages (issue #20).
# Report only: it never fails and never files issues. Each run writes a job summary and uploads the full lychee
# JSON report as the `link-report` artifact (kept 90 days); alerting, if any, belongs to whatever reads that log.
# Posts from 2015-2016 are frozen, so their dead links are recorded but not fixed.
# The dev site is built so internal links are root-relative and checked against this build (--root-dir).
# Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/links.yml
      - .github/scripts/link_report_summary.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Build site
        run: uv run pelican --settings pelicanconf.py --fatal warnings
      - name: Build search index  # search.html links to output/pagefind/
        run: uv run python -m pagefind --site output
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Posts are output/*.html, pages are output/pages/*.html; drafts (output/drafts/) and notebook exports
          # (output/static/) are not scanned. 403/429 are accepted because many sites block automated checkers.
          args: >-
            --root-dir ${{ github.workspace }}/output
            --no-progress
            --max-retries 2
            --timeout 30
            --accept 200..=206,301,302,307,308,403,429
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0 Safari/537.36"
            --exclude "^https?://localhost"
            output/*.html output/pages/*.html
          output: lychee/report.json
          format: json
          fail: false
      - name: Write job summary
        run: python3 .github/scripts/link_report_summary.py lychee/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: link-report
          path: lychee/report.json
          retention-days: 90
