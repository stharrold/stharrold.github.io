# Weekly check of internal and external links in published posts and pages (issue #20).
# Builds the dev site so internal links are root-relative and are checked against this build (--root-dir),
# not the live site. Never blocks deploys; scheduled and manual runs open or update one `link-check` issue.
# Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      broken: ${{ steps.lychee.outputs.exit_code != 0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Build site
        run: uv run pelican --settings pelicanconf.py --fatal warnings
      - name: Build search index  # search.html links to output/pagefind/
        run: uv run python -m pagefind --site output
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Posts are output/*.html, pages are output/pages/*.html; drafts (output/drafts/) and notebook exports
          # (output/static/) are not scanned. 403/429 are accepted because many sites block automated checkers.
          args: >-
            --root-dir ${{ github.workspace }}/output
            --no-progress
            --max-retries 2
            --timeout 30
            --accept 200..=206,301,302,307,308,403,429
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0 Safari/537.36"
            --exclude "^https?://localhost"
            output/*.html output/pages/*.html
          output: lychee/report.md
          format: markdown
          jobSummary: true
          fail: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: link-report
          path: lychee/report.md

  # Only this job can write issues; it runs no third-party code against the build.
  report:
    needs: check
    if: needs.check.outputs.broken == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: link-report
      - name: Find open link-check issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label link-check --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
      - name: Open or update link-check issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6.0.0
        with:
          title: Broken links found by the weekly link check
          content-filepath: report.md
          labels: link-check
          issue-number: ${{ steps.existing.outputs.number }}
