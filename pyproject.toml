[project]
name = "stharrold-github-io"
version = "0.1.0"
description = "Source for Data Science Demos (https://stharrold.github.io), built with Pelican."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pelican[markdown]>=4.12,<5",
    "pelican-i18n-subsites>=1.0",
    "pelican-related-posts>=1.0",
    "pelican-render-math>=1.0.5",
    "pelican-tag-cloud>=1.0.1",
    # Abandoned upstream and not on PyPI; pinned to the archived legacy repo.
    # The vendored pelican-bootstrap3 theme ships Tipue Search 7.0, which this plugin feeds.
    "pelican-tipue-search @ git+https://github.com/getpelican/pelican-plugins@216d1ddb5cf5dc8f5a308d1b1554102013ff7c79#subdirectory=tipue_search",
    "ghp-import>=2.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 170
target-version = "py312"
# Published notebooks are historical content; output/ is generated; themes/ is vendored.
extend-exclude = ["content", "output", "themes"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pelican's documented pattern: publishconf.py extends pelicanconf.py with a star import.
"publishconf.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
